name: Runtime checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r terminal/requirements.txt
      - run: python -m unittest discover -s tests -v
  engine-cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset cpu-check
      - run: cmake --build --preset cpu-check --parallel 2
      - run: ctest --preset cpu-check
