name: Publish AuraPro Engine
on:
  push:
    tags: ['v0.0.2']
  workflow_dispatch:

concurrency:
  group: aurapro-engine-0.0.2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      native: ${{ steps.matrix.outputs.native }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.0.2
          persist-credentials: false
      - name: Reuse or create the draft
        run: |
          if ! gh release view v0.0.2 >/dev/null 2>&1; then
            gh release create v0.0.2 --verify-tag --draft --title 'AuraPro Engine 0.0.2' --notes 'Pro desktop integration for Windows/Linux x64.'
          fi
          test "$(gh release view v0.0.2 --json isDraft --jq .isDraft)" = true
          gh release edit v0.0.2 --notes 'Adds the Q4_K_XL v3.1 preset and improves model download diagnostics. Retired IQ1_M and Lite presets can still start from existing installations. Apple Silicon packages remain standalone previews. AuraPro-maintained control code with original signed native components from Strata v0.2.20.'
      - id: matrix
        run: echo "native=$(python3 tools/packaging/desktop_release.py matrix)" >> "$GITHUB_OUTPUT"
  control:
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, runner: windows-2022 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: ubuntu-24.04 }
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.0.2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack and smoke-test portable control
        shell: bash
        run: |
          python tools/packaging/desktop_release.py control "$TARGET" --out dist
          asset=$(find dist -maxdepth 1 -type f -name "aurapro-engine-control-*-$TARGET.*")
          test -f "$asset"
          mkdir smoke
          runtime=smoke/python/bin/python3
          if [ "$TARGET" = windows-x86_64 ]; then
            python -m zipfile -e "$asset" smoke
            runtime=smoke/python/python.exe
          else
            tar -xf "$asset" -C smoke
          fi
          if [ "$TARGET" = macos-arm64 ]; then
            # Preview only: this runner can inspect the archive but cannot run Mach-O.
            test -x "$runtime"
            test -s smoke/terminal/metal/tools/metal_repack.py
            test -s smoke/terminal/metal/tools/stream_experts.py
          else
            "$runtime" -B -E -s smoke/aurapro_engine.py --version
            "$runtime" -B -E -s smoke/aurapro_engine.py models
            "$runtime" -B -E -s smoke/desktop_runtime.py version
            "$runtime" -B -I -c 'import os, sys, unittest; sys.path.insert(0, os.path.abspath("smoke")); sys.exit(not unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests")).wasSuccessful())'
          fi
          gh release upload v0.0.2 "$asset" --clobber
  native:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.draft.outputs.native) }}
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.0.2
          persist-credentials: false
      - run: |
          asset=$(python3 tools/packaging/desktop_release.py native "$ASSET")
          gh release upload v0.0.2 "$asset" --clobber
  publish:
    needs: [control, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.0.2
          persist-credentials: false
      - run: |
          set -o pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v0.0.2" and .draft) | .id')
          test -n "$release"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release" | python3 tools/packaging/desktop_release.py verify
          gh release edit v0.0.2 --draft=false
